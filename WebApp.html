<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Info</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: Arial, sans-serif;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            text-align: center;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        h1 {
            color: #ff4a4a;
            font-size: 2.5rem;
        }
        p {
            font-size: 1.5rem;
            color: #555;
        }
    </style>
</head>
<body>

<div class="card">
    <h1>Abhishek Dudhpachare</h1>
    <p>PRN: 22510020</p>
</div>

</body>
</html>
